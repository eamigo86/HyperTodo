name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.19.0"
          cache: yarn
          cache-dependency-path: mobile/yarn.lock
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - name: Verify Expo configuration and complete Doctor report
        env:
          # Validation only: the synthetic backend is not contacted or deployed.
          EXPO_PUBLIC_API_URL: https://hypertodo-ci.invalid/hv/
          EXPO_PUBLIC_ALLOW_LOCAL_API: "0"
        run: corepack yarn doctor
