[project]
name = "hypertodo-backend"
version = "0.1.0"
description = "Django backend for the HyperTodo dj-hyperview consumer application."
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django==6.1.1",
  "dj-hyperview[editor,realtime]==0.1.0a21",
  "django-redis>=6.0,<7",
  "pillow>=11,<13",
  "redis>=7.0,<8",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "pytest-django>=4.12,<5",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
markers = ["redis: integration tests against the existing isolated Redis database"]
addopts = "--strict-config --strict-markers --cov=todo --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["todo"]
omit = ["*/migrations/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "ANN", "D"]
ignore = ["D100", "D104", "D106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"todo/migrations/*" = ["ALL"]
"todo/management/*" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
